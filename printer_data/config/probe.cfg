[bltouch]
sensor_pin: ^z_max
control_pin: y_max
x_offset: -30           # твой X offset (зонд левее сопла → минус)
y_offset: -40           # твой Y offset (зонд ближе к себе → минус)
# z_offset: 2.5
speed: 4.0
samples: 3
sample_retract_dist: 3.0

[homing_override]
axes: xyz
gcode:
    # Автоматически считываем z_offset из настроек вашей секции [probe]
    {% set PROBE_OFFSET = printer.configfile.settings.bltouch.z_offset | float %}

    # Проверяем, отпаркованы ли уже ВСЕ оси (X, Y и Z)
    {% if "x" in printer.toolhead.homed_axes and "y" in printer.toolhead.homed_axes and "z" in printer.toolhead.homed_axes %}
        
        # --- БЫСТРЫЙ СТАРТ (Принтер уже отпаркован) ---
        RESPOND MSG="Printer already homed. Re-probing Z at center..."
        
        G90                  # Абсолютные координаты
        G0 Z10 F1200         # Приподнимаем Z перед движением
        G0 X115 Y85 F6000    # Едем в точку пробы
        
        PROBE                # Касание датчиком стола
        G92 Z{PROBE_OFFSET}  # Применяем офсет из конфига [probe]
        
        G91                  # Относительные координаты
        G0 Z2 F800           # Отъезд на 2 мм вверх
        G90                  # Возврат в абсолютные координаты

    {% else %}
        
        # --- ПОЛНЫЙ ЦИКЛ ПАРКОВКИ (Принтер "холодный" или после M84) ---
        RESPOND MSG="Full homing cycle started..."
        
        # 1. Force Move Z вниз на 5 мм
        FORCE_MOVE STEPPER=stepper_z DISTANCE=5 VELOCITY=10

        # 2. Обычный дом для X и Y
        G28 X Y

        # 3. Переход в координаты X250 Y0 для парковки Z по физическому концевику
        G90                  
        G0 X250 Y0 F6000     
        G28 Z                # Парковка Z по физическому концевику

        # 4. Подъем Z на 10 мм после первой парковки
        G0 Z10 F1200

        # 5. Переход в координаты X115 Y85 для калибровки по датчику (Probe)
        G0 X148 Y169 F6000

        # 6. Повторная парковка Z по датчику (Probe)
        PROBE
        G92 Z{PROBE_OFFSET}  # Применяем офсет из конфига [probe]

        # 7. Отъезд на 2 мм вверх после успешной пробы
        G91                  
        G0 Z2 F800          
        G90                  

    {% endif %}

[screws_tilt_adjust]
screw1: 67, 235
screw1_name: rear left screw
screw2: 67, 81
screw2_name: front left screw
screw3: 237, 81
screw3_name: front right screw
screw4: 237, 235
screw4_name: rear right screw
horizontal_move_z: 10
speed: 120
screw_thread: CW-M4


[bed_mesh]
speed: 120                # Скорость перемещения между точками (мм/с)
horizontal_move_z: 5      # Высота Z, на которую поднимается сопло/датчик перед перемещением
mesh_min: 15, 15          # Минимальные координаты сетки (X, Y) — физическое положение сопла!
mesh_max: 210, 195        # Максимальные координаты сетки (X, Y)
probe_count: 5, 5         # Количество точек сканирования по осям X и Y (обычно 3x3, 5x5 или 7x7)
mesh_pps: 2, 2            # Количество точек интерполяции (сглаживания) между основными замерами
algorithm: bicubic        # Алгоритм интерполяции (для сеток от 5x5 лучше использовать bicubic)
fade_start: 1.0           # Высота (в мм), с которой начинается постепенная отмена компенсации
fade_end: 10.0            # Высота (в мм), на которой компенсация полностью отключается
fade_target: 0            # Целевое смещение после fade_end (0 — по умолчанию)
